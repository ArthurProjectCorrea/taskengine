<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div ref="{{ splitRef }}" style="display:flex">
  <button onClick="{{ onMainClick }}" style="flex:1;min-width:0;border:1px solid #0059AC;background:#005FB8;color:#fff;font:600 13px/1 'Segoe UI Variable Display','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;padding:11px;border-radius:5px 0 0 5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" style-hover="background:#1A6DBE">{{ mainLabel }}</button>
  <button onClick="{{ toggleMenu }}" style="width:34px;flex:none;border:1px solid #0059AC;border-left:1px solid rgba(255,255,255,.3);background:#005FB8;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:0 5px 5px 0;cursor:pointer" style-hover="background:#1A6DBE">
    <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
  </button>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeMenu }}" style="position:fixed;inset:0;z-index:30"></div>
<div style="position:fixed;top:{{ menuTop }};left:{{ menuLeft }};width:{{ menuWidth }};z-index:31;border-radius:7px;background:#FBFBFB;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 10px 28px rgba(0,0,0,.2);padding:5px;display:flex;flex-direction:column;gap:1px">
  <sc-for list="{{ options }}" as="opt" hint-placeholder-count="4">
  <button onClick="{{ opt.selectWrapped }}" style="display:flex;align-items:center;gap:9px;padding:9px 10px;border:none;background:transparent;border-radius:5px;cursor:pointer;text-align:left;font:400 13px/1 'Segoe UI Variable Display','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:#1A1A1A" style-hover="background:rgba(0,0,0,.05)">
    <span style="width:7px;height:7px;border-radius:50%;background:{{ opt.color }};flex:none"></span>{{ opt.label }}
  </button>
  </sc-for>
</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:44},&quot;mainLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Concluir&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onMain&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,color:string,select:()=&gt;void}[]&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false, menuPos: null };
  renderVals() {
    const st = this.state;
    const options = this.props.options || [];
    return {
      mainLabel: this.props.mainLabel,
      onMainClick: this.props.onMain,
      splitRef: node => { this.node = node; },
      menuOpen: st.menuOpen,
      toggleMenu: () => {
        if (!this.state.menuOpen && this.node) {
          const r = this.node.getBoundingClientRect();
          this.setState({ menuOpen: true, menuPos: { top: (r.bottom + 6) + 'px', left: r.left + 'px', width: r.width + 'px' } });
        } else {
          this.setState({ menuOpen: false });
        }
      },
      closeMenu: () => this.setState({ menuOpen: false }),
      menuTop: (st.menuPos && st.menuPos.top) || '0px',
      menuLeft: (st.menuPos && st.menuPos.left) || '0px',
      menuWidth: (st.menuPos && st.menuPos.width) || 'auto',
      options: options.map(o => ({
        label: o.label, color: o.color,
        selectWrapped: () => { this.setState({ menuOpen: false }); o.select(); },
      })),
    };
  }
}

</script>
</body>
</html>
