<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><style>
:root{--fam:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#F3F3F3;font-family:var(--fam);-webkit-font-smoothing:antialiased}
a{color:#005FB8;text-decoration:none}a:hover{color:#0078D4;text-decoration:underline}
button{font-family:var(--fam)}
</style></helmet>

<div style="width:100vw;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;background:#F3F3F3;color:#1A1A1A">
  <div style="flex:none;display:flex;align-items:center;height:40px;padding-left:14px">
    <div style="display:flex;align-items:center;gap:9px;flex:1">
      <div style="width:16px;height:16px;border-radius:4px;background:#005FB8;display:flex;align-items:center;justify-content:center">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h9M4 12h6M4 17h11"/></svg>
      </div>
      <div style="font:400 12px/1 var(--fam);color:#3B3B3B">TaskEngine - 1.0.0</div>
    </div>
    <div style="display:flex;height:40px">
      <div style="width:44px;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:rgba(0,0,0,.05)"><svg width="10" height="10" viewBox="0 0 10 10" stroke="#1A1A1A" stroke-width="1"><path d="M0 5h10"/></svg></div>
      <div style="width:44px;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:rgba(0,0,0,.05)"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#1A1A1A" stroke-width="1"><path d="M2.2 2.2h5.6v5.6H2.2z"/><path d="M.9 3.4V.9h5.6v1.3" opacity=".85"/></svg></div>
      <div style="width:44px;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#C42B1C"><svg width="10" height="10" viewBox="0 0 10 10" stroke="#1A1A1A" stroke-width="1"><path d="M0 0l10 10M10 0L0 10"/></svg></div>
    </div>
  </div>

  <div style="flex:1;min-height:0;display:flex;gap:0">

    <div style="flex:none;width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px 0 10px">
      <div onClick="{{ goDash }}" onMouseEnter="{{ tipDash }}" onMouseLeave="{{ tipOut }}" style="position:relative;width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:rgba(0,0,0,.05)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3B3B3B" stroke-width="1.7" stroke-linejoin="round"><rect x="3.2" y="3.2" width="7.6" height="7.6" rx="2"/><rect x="13.2" y="3.2" width="7.6" height="7.6" rx="2"/><rect x="3.2" y="13.2" width="7.6" height="7.6" rx="2"/><rect x="13.2" y="13.2" width="7.6" height="7.6" rx="2"/></svg>
        <sc-if value="{{ tipIsDash }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:48px;top:50%;transform:translateY(-50%);z-index:30;white-space:nowrap;padding:6px 10px;border-radius:5px;background:#FBFBFB;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.16);font:400 12px/1 var(--fam);color:#1A1A1A">Dashboard</div>
        </sc-if>
      </div>
      <div onClick="{{ goTasks }}" onMouseEnter="{{ tipTasks }}" onMouseLeave="{{ tipOut }}" style="position:relative;width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:rgba(0,0,0,.05)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3B3B3B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="4" width="17.2" height="16" rx="2.6"/><path d="M7.4 9.2l1.6 1.6 2.8-2.8M7.4 15.2l1.6 1.6 2.8-2.8M14.6 9h3M14.6 15h3"/></svg>
        <sc-if value="{{ tipIsTasks }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:48px;top:50%;transform:translateY(-50%);z-index:30;white-space:nowrap;padding:6px 10px;border-radius:5px;background:#FBFBFB;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.16);font:400 12px/1 var(--fam);color:#1A1A1A">Tarefas</div>
        </sc-if>
      </div>
      <div onClick="{{ goCfg }}" onMouseEnter="{{ tipCfg }}" onMouseLeave="{{ tipOut }}" style="position:relative;width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:rgba(0,0,0,.05)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3B3B3B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.2 14.4a7.6 7.6 0 0 0 0-4.8l1.8-1.3-1.9-3.3-2.1.8a7.6 7.6 0 0 0-4.2-2.4L12.3 1H11l-.5 2.4a7.6 7.6 0 0 0-4.2 2.4l-2.1-.8L2.3 8.3l1.8 1.3a7.6 7.6 0 0 0 0 4.8l-1.8 1.3 1.9 3.3 2.1-.8a7.6 7.6 0 0 0 4.2 2.4L11 23h1.3l.5-2.4a7.6 7.6 0 0 0 4.2-2.4l2.1.8 1.9-3.3z"/></svg>
        <sc-if value="{{ tipIsCfg }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:48px;top:50%;transform:translateY(-50%);z-index:30;white-space:nowrap;padding:6px 10px;border-radius:5px;background:#FBFBFB;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.16);font:400 12px/1 var(--fam);color:#1A1A1A">Configurações</div>
        </sc-if>
      </div>
    </div>

    <div style="flex:1;min-width:0;margin:0 8px 8px 0;border-radius:8px;background:#FBFBFB;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;overflow:hidden">
      <div style="flex:none;display:flex;align-items:center;gap:12px;padding:14px 18px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)">
        <button onClick="{{ goBack }}" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:5px;cursor:pointer;flex:none" style-hover="background:rgba(0,0,0,.05)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
          <div style="font:400 11px/1.2 var(--fam);color:#8A8A8A">Relatório · #{{ taskId }}</div>
          <div style="font:600 17px/1.3 var(--fam)">Arquivos alterados</div>
        </div>
        <button onClick="{{ exportCsv }}" style="display:flex;align-items:center;gap:7px;border:1px solid rgba(0,0,0,.1);background:#fff;color:#1A1A1A;font:600 12.5px/1 var(--fam);padding:9px 14px;border-radius:5px;cursor:pointer;white-space:nowrap" style-hover="background:#F0F0F0">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.9" stroke-linecap="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4.5 19.5h15"/></svg>Exportar CSV
        </button>
      </div>

      <div style="flex:1;min-height:0;overflow:auto;padding:20px 22px">
        <div style="position:relative;min-width:560px">
          <div style="position:relative;height:24px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)">
            <sc-for list="{{ rows.ticks }}" as="tk" hint-placeholder-count="6">
              <div style="position:absolute;top:0;left:{{ tk.left }};transform:translateX(-50%);font:400 11px/24px ui-monospace,Menlo,monospace;color:#8A8A8A;white-space:nowrap">{{ tk.label }}</div>
            </sc-for>
          </div>
          <sc-for list="{{ rows.lanes }}" as="lane" hint-placeholder-count="3">
            <div style="position:relative;height:44px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.05)">
              <sc-for list="{{ lane.bars }}" as="bar" hint-placeholder-count="1">
                <div style="position:absolute;top:7px;left:{{ bar.left }};width:{{ bar.width }};display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;background:rgba(15,123,15,.08);box-shadow:inset 0 0 0 1px rgba(15,123,15,.35);overflow:hidden">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F7B0F" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12l2.3 2.3 4.7-4.7"/></svg>
                  <span style="font:400 12px/1.3 ui-monospace,Menlo,monospace;color:#1A1A1A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0">{{ bar.path }}</span>
                  <span style="font:600 11px/1 var(--fam);color:#5D5D5D;flex:none">{{ bar.time }}</span>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const FILES = [
  { path: 'src/services/worklogCalculator.ts', time: '48min', start: 0, dur: 48 },
  { path: 'src/ui/screens/TaskDetail.tsx', time: '35min', start: 0, dur: 35 },
  { path: 'src/providers/github/schema.ts', time: '18min', start: 40, dur: 18 },
  { path: 'tests/worklogCalculator.spec.ts', time: '12min', start: 60, dur: 12 },
  { path: 'src/ui/screens/TaskDetail.tsx', time: '9min', start: 78, dur: 9 },
];
function buildLanes(files) {
  const items = files.slice().sort((a, b) => a.start - b.start);
  const laneEnds = [];
  const lanes = [];
  items.forEach(f => {
    let lane = laneEnds.findIndex(end => end <= f.start);
    if (lane === -1) { lane = laneEnds.length; lanes.push([]); }
    laneEnds[lane] = f.start + f.dur;
    lanes[lane].push(f);
  });
  const totalMin = Math.max(10, ...items.map(f => f.start + f.dur)) + 8;
  return { lanes, totalMin };
}
class Component extends DCLogic {
  state = { tip: null };
  renderVals() {
    const st = this.state;
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('id') || this.props.taskId || 142;
    const { lanes, totalMin } = buildLanes(FILES);
    const tickStep = totalMin > 60 ? 20 : 10;
    const ticks = [];
    for (let m = 0; m <= totalMin; m += tickStep) ticks.push({ label: m + 'min', left: Math.round((m / totalMin) * 100) + '%' });
    const rows = {
      ticks,
      lanes: lanes.map(lane => ({
        bars: lane.map(f => ({
          path: f.path, time: f.time,
          left: Math.round((f.start / totalMin) * 100) + '%',
          width: Math.round((f.dur / totalMin) * 100) + '%',
        })),
      })),
    };
    return {
      taskId,
      tipIsDash: st.tip === 'dash', tipIsTasks: st.tip === 'tasks', tipIsCfg: st.tip === 'cfg',
      tipDash: () => this.setState({ tip: 'dash' }),
      tipTasks: () => this.setState({ tip: 'tasks' }),
      tipCfg: () => this.setState({ tip: 'cfg' }),
      tipOut: () => this.setState({ tip: null }),
      goDash: () => { window.location.href = 'TaskEngine Dashboard.dc.html'; },
      goTasks: () => { window.location.href = 'TaskEngine Tarefas.dc.html'; },
      goCfg: () => { window.location.href = 'TaskEngine Configurações.dc.html'; },
      goBack: () => { window.location.href = 'TaskEngine Detalhes da Tarefa.dc.html?id=' + taskId; },
      rows,
      exportCsv: () => {
        const lines = ['arquivo,tempo,início (min)'].concat(FILES.map(f => f.path + ',' + f.time + ',' + f.start));
        const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'relatorio-tarefa-' + taskId + '.csv'; a.click();
        URL.revokeObjectURL(url);
      },
    };
  }
}
</script>
</body>
</html>
